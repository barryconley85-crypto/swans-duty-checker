name: Run connection pass once
on:
  push:
    paths:
      - ".github/workflows/run-connections-once.yml"
jobs:
  connections:
    runs-on: ubuntu-latest
    steps:
      - name: Run connection pass
        env:
          KEY: ${{ secrets.DUTY_CHECKER_DB_KEY }}
        run: |
          curl --fail-with-body --max-time 240 -X POST "https://swans-duty-checker.vercel.app/api/connections" \
            -H "Content-Type: application/json" \
            -H "x-duty-checker-key: $KEY" \
            --data '{"importId":"ZQoVu9Y1T4rolnfLz3gav"}'
